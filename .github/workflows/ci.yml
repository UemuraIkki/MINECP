name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    name: bridge (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .[dev]
      - name: Test
        run: pytest -q

  mod:
    name: mod (gradle build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (Automatone依存解決込み)
        run: |
          chmod +x gradlew
          ./gradlew build -Pwith_automatone=true --no-daemon
