plugins {
    id "fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.ladysnake.org/releases" }
    // Automatoneの推移的依存(quilt-loader / QSL / quilted-fabric-api)の解決先
    maven { url = "https://maven.quiltmc.org/repository/release" }
    // Automatoneの推移的依存 reach-entity-attributes の解決先
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    def websocket = implementation("org.java-websocket:Java-WebSocket:1.5.6")
    include(websocket)

    if (project.with_automatone.toBoolean()) {
        modRuntimeOnly "io.github.ladysnake:automatone:${project.automatone_version}"
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = "UTF-8"
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
